apiVersion: v1
kind: ServiceAccount
metadata:
  name: eph-node-agent
  namespace: ai-agent-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eph-node-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machines", "machinedeployments", "machinehealthchecks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["kubeadmconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["kubeadmcontrolplanes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["metal3clusters", "metal3machines", "metal3machinetemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["metal3.io"]
    resources: ["baremetalhosts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version", "/api", "/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eph-node-agent-readonly
subjects:
  - kind: ServiceAccount
    name: eph-node-agent
    namespace: ai-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eph-node-agent-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eph-node-agent-network-inspection
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eph-node-agent-network-inspection
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: eph-node-agent
    namespace: ai-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eph-node-agent-network-inspection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eph-node-agent-workload-readonly
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eph-node-agent-workload-readonly
  namespace: default
subjects:
  - kind: ServiceAccount
    name: eph-node-agent
    namespace: ai-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eph-node-agent-workload-readonly
---
