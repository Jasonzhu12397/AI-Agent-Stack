apiVersion: v1
kind: ServiceAccount
metadata:
  name: eph-agent
  namespace: ai-agent-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eph-agent-preflight
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eph-agent-metal3-deployer
  namespace: metal3
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["metal3.io"]
    resources: ["baremetalhosts"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machines", "machinedeployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["kubeadmconfigs", "kubeadmconfigtemplates"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["kubeadmcontrolplanes"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["metal3clusters", "metal3machinetemplates", "metal3datatemplates"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eph-agent-metal3-deployer
  namespace: metal3
subjects:
  - kind: ServiceAccount
    name: eph-agent
    namespace: ai-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eph-agent-metal3-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eph-agent-preflight
subjects:
  - kind: ServiceAccount
    name: eph-agent
    namespace: ai-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eph-agent-preflight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: target-agent-source-operator
  namespace: ai-agent-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
