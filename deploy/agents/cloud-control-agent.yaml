apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-control-agent
  namespace: ai-agent-system
  labels:
    app.kubernetes.io/name: cloud-control-agent
    app.kubernetes.io/part-of: ai-agent-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-control-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-control-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloud-control-agent
          image: REPLACE_WITH_REGISTRY/ai-agent-cloud-control-agent:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: mtls-api
              containerPort: 8443
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloud-control-agent-database
                  key: database-url
            - name: CLOUD_CONTROL_TLS_CERT_FILE
              value: /var/run/secrets/cloud-control/tls/tls.crt
            - name: CLOUD_CONTROL_TLS_KEY_FILE
              value: /var/run/secrets/cloud-control/tls/tls.key
            - name: CLOUD_CONTROL_TLS_CLIENT_CA_FILE
              value: /var/run/secrets/cloud-control/tls/client-ca.crt
            - name: CLOUD_CONTROL_BIND_HOST
              value: 0.0.0.0
            - name: CLOUD_CONTROL_BIND_PORT
              value: "8443"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cloud-control-tls
              mountPath: /var/run/secrets/cloud-control/tls
              readOnly: true
          readinessProbe:
            exec:
              command: ["python", "-m", "apps.cloud_control_agent.main", "--readiness-check"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "apps.cloud_control_agent.main", "--healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: cloud-control-tls
          secret:
            secretName: cloud-control-agent-mtls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: client-ca.crt
                path: client-ca.crt
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-control-agent
  namespace: ai-agent-system
  labels:
    app.kubernetes.io/name: cloud-control-agent
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cloud-control-agent
  ports:
    - name: mtls-api
      port: 8443
      targetPort: mtls-api
      protocol: TCP
