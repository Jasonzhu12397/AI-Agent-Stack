apiVersion: apps/v1
kind: Deployment
metadata:
  name: eph-node-agent
  namespace: ai-agent-system
  labels:
    app.kubernetes.io/name: eph-node-agent
    app.kubernetes.io/part-of: ai-agent-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eph-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eph-node-agent
    spec:
      serviceAccountName: eph-node-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: REPLACE_WITH_REGISTRY/ai-agent-stack:VERSION
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "apps.node_agent.agent", "--poll-seconds", "5"]
          env:
            - name: APP_ENV
              value: production
            - name: AGENT_NODE_TYPE
              value: eph_node
            - name: AGENT_HOST_SYSFS_PATH
              value: /host/sys
            - name: AGENT_CONTROL_URL
              valueFrom:
                secretKeyRef:
                  name: eph-node-agent-credentials
                  key: control-url
            - name: AGENT_NODE_ID
              valueFrom:
                secretKeyRef:
                  name: eph-node-agent-credentials
                  key: node-id
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eph-node-agent-credentials
                  key: token
            - name: IRONIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: ironic-api-credentials
                  key: api-url
                  optional: true
            - name: IRONIC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ironic-api-credentials
                  key: token
                  optional: true
            - name: CAPI_PIVOT_SECRET_DIR
              value: /var/run/secrets/ai-agent/capi-pivot
            - name: CAPI_PIVOT_SOURCE_KUBECONFIG
              value: /var/run/secrets/ai-agent/capi-pivot/source.kubeconfig
            - name: CAPI_PIVOT_TARGET_KUBECONFIG
              value: /var/run/secrets/ai-agent/capi-pivot/target.kubeconfig
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: agent-health
              mountPath: /tmp
            - name: host-sysfs
              mountPath: /host/sys
              readOnly: true
            - name: capi-pivot-kubeconfigs
              mountPath: /var/run/secrets/ai-agent/capi-pivot
              readOnly: true
          readinessProbe:
            exec:
              command: ["python", "-m", "apps.node_agent.agent", "--readiness-check"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "apps.node_agent.agent", "--healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: host-sysfs
          hostPath:
            path: /sys
            type: Directory
        - name: agent-health
          emptyDir:
            sizeLimit: 1Mi
        - name: capi-pivot-kubeconfigs
          secret:
            secretName: capi-pivot-kubeconfigs
            items:
              - key: source.kubeconfig
                path: source.kubeconfig
              - key: target.kubeconfig
                path: target.kubeconfig
            defaultMode: 0440
