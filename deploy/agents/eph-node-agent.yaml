apiVersion: apps/v1
kind: Deployment
metadata:
  name: eph-node-agent
  namespace: ai-agent-system
  labels:
    app.kubernetes.io/name: eph-node-agent
    app.kubernetes.io/part-of: ai-agent-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eph-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eph-node-agent
    spec:
      serviceAccountName: eph-node-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: REPLACE_WITH_REGISTRY/ai-agent-stack:VERSION
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "apps.node_agent.agent", "--poll-seconds", "5"]
          env:
            - name: APP_ENV
              value: production
            - name: AGENT_NODE_TYPE
              value: eph_node
            - name: AGENT_CONTROL_URL
              valueFrom:
                secretKeyRef:
                  name: eph-node-agent-credentials
                  key: control-url
            - name: AGENT_NODE_ID
              valueFrom:
                secretKeyRef:
                  name: eph-node-agent-credentials
                  key: node-id
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eph-node-agent-credentials
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; raise SystemExit(0 if os.environ.get('AGENT_NODE_ID') else 1)"]
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; raise SystemExit(0 if os.environ.get('AGENT_TOKEN') else 1)"]
            initialDelaySeconds: 10
            periodSeconds: 30
