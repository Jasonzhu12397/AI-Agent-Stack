services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${AI_AGENT_API_IMAGE:-ai-agent-api:local}
    env_file:
      - ../.env.cloud
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-}
      MODEL_PROVIDER_ALLOWED_HOSTS: ${MODEL_PROVIDER_ALLOWED_HOSTS:-}
      PLUGIN_HTTP_ALLOWED_HOSTS: ${PLUGIN_HTTP_ALLOWED_HOSTS:-}
      PLUGIN_CREDENTIAL_RESOLVER: ${PLUGIN_CREDENTIAL_RESOLVER:-}
    command:
      - sh
      - -c
      - python apps/platform-api/manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 platform_api.asgi:application
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${AI_AGENT_API_IMAGE:-ai-agent-api:local}
    env_file:
      - ../.env.cloud
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-}
      MODEL_PROVIDER_ALLOWED_HOSTS: ${MODEL_PROVIDER_ALLOWED_HOSTS:-}
      PLUGIN_HTTP_ALLOWED_HOSTS: ${PLUGIN_HTTP_ALLOWED_HOSTS:-}
      PLUGIN_CREDENTIAL_RESOLVER: ${PLUGIN_CREDENTIAL_RESOLVER:-}
    command: ["python", "-m", "worker_app.main"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web-studio
      args:
        VITE_API_BASE_URL: ""
    image: ${AI_AGENT_WEB_IMAGE:-ai-agent-web:local}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
