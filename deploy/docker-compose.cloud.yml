services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${AI_AGENT_API_IMAGE:-ai-agent-api:local}
    env_file:
      - ../.env.cloud
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-}
      MODEL_PROVIDER_ALLOWED_HOSTS: ${MODEL_PROVIDER_ALLOWED_HOSTS:-}
      PLUGIN_HTTP_ALLOWED_HOSTS: ${PLUGIN_HTTP_ALLOWED_HOSTS:-}
      PLUGIN_CREDENTIAL_RESOLVER: ${PLUGIN_CREDENTIAL_RESOLVER:-}
      AGENT_MTLS_REQUIRED: ${AGENT_MTLS_REQUIRED:-false}
      AGENT_MTLS_TRUSTED_PROXY_IP: ${AGENT_MTLS_INGRESS_IP:-172.30.250.2}
      AGENT_MTLS_TRUSTED_PROXY_CIDRS: ${AGENT_MTLS_TRUSTED_PROXY_CIDRS:-}
    command:
      - sh
      - -c
      - python apps/platform-api/manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 platform_api.asgi:application
    expose:
      - "8000"
    networks:
      - default
      - agent_mtls
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${AI_AGENT_API_IMAGE:-ai-agent-api:local}
    env_file:
      - ../.env.cloud
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-}
      MODEL_PROVIDER_ALLOWED_HOSTS: ${MODEL_PROVIDER_ALLOWED_HOSTS:-}
      PLUGIN_HTTP_ALLOWED_HOSTS: ${PLUGIN_HTTP_ALLOWED_HOSTS:-}
      PLUGIN_CREDENTIAL_RESOLVER: ${PLUGIN_CREDENTIAL_RESOLVER:-}
    command: ["python", "-m", "worker_app.main"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true


  agent-mtls-ingress:
    image: haproxy:3.2-alpine
    profiles:
      - agent-mtls
    ports:
      - "${AGENT_MTLS_BIND_ADDRESS:-127.0.0.1}:${AGENT_MTLS_PORT:-8443}:8443"
    volumes:
      - ./cloud-control-plane/agent-mtls/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - type: bind
        source: ${AGENT_MTLS_SERVER_PEM:-/etc/ai-agent/agent-ingress.pem}
        target: /run/secrets/agent-ingress.pem
        read_only: true
      - type: bind
        source: ${AGENT_MTLS_CLIENT_CA_PEM:-/etc/ai-agent/agent-client-ca.pem}
        target: /run/secrets/agent-client-ca.pem
        read_only: true
    depends_on:
      api:
        condition: service_healthy
    networks:
      agent_mtls:
        ipv4_address: ${AGENT_MTLS_INGRESS_IP:-172.30.250.2}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web-studio
      args:
        VITE_API_BASE_URL: ""
    image: ${AI_AGENT_WEB_IMAGE:-ai-agent-web:local}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  default: {}
  agent_mtls:
    internal: true
    ipam:
      config:
        - subnet: ${AGENT_MTLS_NETWORK_SUBNET:-172.30.250.0/24}
