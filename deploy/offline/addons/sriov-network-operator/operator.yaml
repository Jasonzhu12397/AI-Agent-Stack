# Source: sriov-network-operator-chart/templates/sriovoperatorconfig.yaml
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovOperatorConfig
metadata:
  name: default
  namespace: sriov-network-operator
spec:
  enableInjector: false
  enableOperatorWebhook: false
  logLevel: 2
  disableDrain: false
  configurationMode: daemon
---
# Source: sriov-network-operator-chart/templates/pre-delete-webooks.yaml
# The following job will be used as Helm pre-delete hook. It executes a small go-client binary
# which intent to delete 'default' SriovOperatorConfig, that triggers operator removal of generated cluster objects
# e.g. mutating/validating webhooks, within operator's recoinciling loop and 
# preventing operator cluster object remainings while using helm uninstall
apiVersion: batch/v1
kind: Job
metadata:
  name: sriov-network-operator-pre-delete-hook
  namespace: sriov-network-operator
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  template:
    spec:
      serviceAccountName: sriov-network-operator      
      containers:
        - name: cleanup
          image: ghcr.io/k8snetworkplumbingwg/sriov-network-operator:v1.6.0
          command:
            - sriov-network-operator-config-cleanup
          args:
            - --namespace
            - sriov-network-operator
      restartPolicy: Never
  backoffLimit: 2
