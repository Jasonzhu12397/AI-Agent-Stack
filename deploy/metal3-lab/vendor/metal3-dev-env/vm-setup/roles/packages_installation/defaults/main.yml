packages:
  ubuntu:
    common:
      packages:
      - python3-setuptools
      - zlib1g-dev
      - openssh-server
      - wget
      - curl
      - dnsmasq
      - nmap
      - patch
      - psmisc
      - bridge-utils
      - jq
      - unzip
      - genisoimage
      - apache2-utils
    jammy:
      packages:
      - apparmor
      - apparmor-profiles-extra
      - apparmor-utils
      - libssl-dev
      - netcat
    noble:
      packages:
      - apparmor
      - apparmor-profiles-extra
      - apparmor-utils
      - libssl-dev
      - netcat-traditional
    pip3:
    - python-apt
    - kubernetes==25.3.0
    - pyYAML
    - lxml
    - netaddr
    - six
    - jmespath
    - passlib
OS_VERSION_ID: "{{ lookup('env', 'OS_VERSION_ID') }}"
REGISTRY: "{{ lookup('env', 'REGISTRY') }}"
ANSIBLE_VENV: "{{ lookup('env', 'ANSIBLE_VENV') | default('/usr', true) }}"
# Go related variables, expected to be updated when new versions are released:
go_version: "1.25.14"
go_min_version: "1.25"
# Construct Go download URL and tarball name
go_custom_mirror: "https://go.dev/dl"
go_checksum: ""
go_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
go_tarball: "go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
go_download_url: "{{ go_custom_mirror | regex_replace('/$', '') }}/{{ go_tarball }}"
