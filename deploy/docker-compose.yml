services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_stack
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_stack"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    profiles: ["local-models"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-ollama}
      QDRANT_URL: http://qdrant:6333
    command: ["sh", "-c", "python apps/platform-api/manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 platform_api.asgi:application"]
    ports: ["8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
  etcd-backup-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${AI_AGENT_PLATFORM_IMAGE:-ai-agent-platform:local}
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
      ETCD_BACKUP_INTERVAL_SECONDS: ${ETCD_BACKUP_INTERVAL_SECONDS:-3600}
    command:
      - sh
      - -c
      - >-
        while true; do
        python apps/platform-api/manage.py queue_etcd_backups || true;
        sleep "$${ETCD_BACKUP_INTERVAL_SECONDS}";
        done
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
  etcd-backup-watchdog:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${AI_AGENT_PLATFORM_IMAGE:-ai-agent-platform:local}
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
      ETCD_BACKUP_WATCHDOG_INTERVAL_SECONDS: ${ETCD_BACKUP_WATCHDOG_INTERVAL_SECONDS:-3600}
      ETCD_BACKUP_ALERT_WEBHOOK: ${ETCD_BACKUP_ALERT_WEBHOOK:-}
    command:
      - sh
      - -c
      - >-
        while true; do
        python apps/platform-api/manage.py check_etcd_backups || true;
        sleep "$${ETCD_BACKUP_WATCHDOG_INTERVAL_SECONDS}";
        done
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.cloud-agent
    image: ${AI_AGENT_CLOUD_AGENT_IMAGE:-ai-agent-cloud-agent:local}
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-ollama}
      QDRANT_URL: http://qdrant:6333
    command: ["python", "-m", "worker_app.main"]
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: apps/web-studio/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
