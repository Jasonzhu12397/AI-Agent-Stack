services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_stack
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_stack"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "python apps/platform-api/manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 platform_api.asgi:application"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "worker_app.main"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: apps/web-studio/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
