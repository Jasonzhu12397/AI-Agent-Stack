services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_stack
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_stack"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    profiles: ["local-models"]
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  api:
    build:
      context: ..
      dockerfile: apps/rust-api/Dockerfile
    env_file: [../.env]
    environment:
      APP_ENV: ${APP_ENV:-development}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_API_LISTEN: 0.0.0.0:8080
      RUST_API_SECURE_COOKIES: ${RUST_API_SECURE_COOKIES:-false}
      DATABASE_URL: postgresql://agent:agent_dev_password@postgres:5432/agent_stack
      REDIS_URL: redis://redis:6379/0
      LOCAL_MODEL_ALLOWED_HOSTS: ${LOCAL_MODEL_ALLOWED_HOSTS:-ollama}
      QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:8000:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: apps/web-studio/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
