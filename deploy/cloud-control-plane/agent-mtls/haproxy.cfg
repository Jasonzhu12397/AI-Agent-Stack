global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend agent_mtls
    bind :8443 ssl crt /run/secrets/agent-ingress.pem ca-file /run/secrets/agent-client-ca.pem verify required ssl-min-ver TLSv1.2 alpn h2,http/1.1
    http-request deny deny_status 404 unless { path_beg /api/v1/agent-runtime/ }
    http-request del-header X-Verified-Client-Cert-SHA256
    http-request del-header X-SSL-Client-Verify
    http-request del-header X-SSL-Client-DN
    http-request del-header X-SSL-Client-Cert
    http-request del-header X-Client-Cert
    http-request del-header X-Forwarded-Client-Cert
    http-request set-header X-Verified-Client-Cert-SHA256 %[ssl_c_der,sha2(256),hex]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    default_backend agent_api

backend agent_api
    server api api:8000 check
