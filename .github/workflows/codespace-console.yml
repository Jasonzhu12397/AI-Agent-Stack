name: codespace-console

on:
  workflow_dispatch:
    inputs:
      codespace:
        description: Codespace name
        required: true
        default: bookish-space-computing-machine-q74qrqrgppr6f4w5v
      probe:
        description: "Set to 1 to print a masked credential report and stop"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bring-up:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install GitHub CLI
        run: gh --version
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
      - name: Prepare and start the console inside the codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          set -o pipefail
          # The Codespaces REST API intermittently returns 500. Retry the SSH
          # handshake instead of failing the whole deployment on one blip.
          for attempt in 1 2 3 4; do
            if gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && python3 .devcontainer/ensure_console.py' 2>&1 | tail -80; then
              exit 0
            fi
            echo "codespace SSH failed (attempt ${attempt})" >&2
            sleep 15
          done
          exit 1
      - name: Probe model credential resolution
        if: ${{ inputs.probe == '1' }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && python3 .devcontainer/probe_credentials.py' 2>&1 | tail -40
      - name: Publish the console ports
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          for attempt in 1 2 3 4; do
            if gh codespace ports visibility 8000:public -c "$CS" && gh codespace ports -c "$CS"; then
              exit 0
            fi
            echo "port publishing failed (attempt ${attempt})" >&2
            sleep 15
          done
          exit 1
      - name: Report the API log
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          for attempt in 1 2 3 4; do
            if gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && python3 .devcontainer/log_report.py'; then
              exit 0
            fi
            echo "log report failed (attempt ${attempt})" >&2
            sleep 15
          done
          exit 1

      - name: Open a gate-free tunnel for the console
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && python3 .devcontainer/tunnel.py' | tee /tmp/tunnel.txt; then
              break
            fi
            echo "tunnel start failed (attempt ${attempt})" >&2
            sleep 15
          done
          URL=$(grep -o "https://[a-z0-9-]*\.trycloudflare\.com" /tmp/tunnel.txt | head -1)
          if [ -z "$URL" ]; then
            echo "tunnel URL was not published" >&2
            exit 1
          fi
          echo "console=$URL" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -o /dev/null -w "tunnel=%{http_code}\n" "$URL/health/ready" || true
          curl -fsS "$URL/" | grep -o "<title>[^<]*" || true

      - name: Smoke test the public console
        env:
          CS: ${{ inputs.codespace }}
        run: |
          set -o pipefail
          base="https://${CS}-8000.app.github.dev"
          # GitHub publishes the forwarded port asynchronously. The tunnel can
          # already answer while the public host still serves a front-door 404.
          # Propagation has been observed to take several minutes and to lag
          # behind the origin health check, so poll for up to ten minutes and
          # fail only when the public route never becomes ready.
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "${base}/health/ready"; then
              echo "health ready after ${attempt} attempt(s)"
              ready=1
              break
            fi
            echo "health not ready yet (attempt ${attempt})"
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "public console health never became ready" >&2
            exit 1
          fi
          curl -fsS "${base}/" | head -c 120
