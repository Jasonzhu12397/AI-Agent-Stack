name: codespace-console

on:
  workflow_dispatch:
    inputs:
      codespace:
        description: Codespace name
        required: true
        default: bookish-space-computing-machine-q74qrqrgppr6f4w5v

permissions:
  contents: read

jobs:
  bring-up:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install GitHub CLI
        run: gh --version
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
      - name: Prepare and start the console inside the codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          set -o pipefail
          gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && python3 .devcontainer/ensure_console.py' 2>&1 | tail -80
      - name: Publish the console ports
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          gh codespace ports visibility 8000:public -c "$CS"
          gh codespace ports -c "$CS"
      - name: Report the API log
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && grep -inE "login|csrf|forbidden|access" .devdata/api.log | tail -n 40'

      - name: Open a gate-free tunnel for the console
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          CS: ${{ inputs.codespace }}
        run: |
          set -o pipefail
          gh codespace ssh -c "$CS" -- 'cd /workspaces/AI-Agent-Stack && python3 .devcontainer/tunnel.py' | tee /tmp/tunnel.txt
          URL=$(grep -o "https://[a-z0-9-]*\.trycloudflare\.com" /tmp/tunnel.txt | head -1)
          echo "console=$URL" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -o /dev/null -w "tunnel=%{http_code}\n" "$URL/health/ready" || true
          curl -fsS "$URL/" | grep -o "<title>[^<]*" || true

      - name: Smoke test the public console
        env:
          CS: ${{ inputs.codespace }}
        run: |
          set -o pipefail
          curl -fsS -o /dev/null "https://${CS}-8000.app.github.dev/health/ready"
          curl -fsS "https://${CS}-8000.app.github.dev/" | head -c 120
