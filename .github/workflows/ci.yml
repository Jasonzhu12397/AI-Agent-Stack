name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**", "refactor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------- Rust platform API ----------------
  rust-api:
    name: Rust platform API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_stack
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_stack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agent:agent_dev_password@localhost:5432/agent_stack
    defaults:
      run:
        working-directory: apps/rust-api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/rust-api/target
          key: rust-api-${{ hashFiles('apps/rust-api/Cargo.lock') }}
          restore-keys: rust-api-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Diagnose generated Cargo lockfile
        run: |
          cargo generate-lockfile
          git diff -- Cargo.lock
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Container build
        working-directory: .
        run: docker build -f apps/rust-api/Dockerfile -t ai-agent-stack-api:ci .

  # ---------------- Stage 1: static quality bars ----------------
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install "ruff>=0.6,<1.0"
      - name: Ruff
        run: ruff check .
      - name: Workflow lint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin actionlint
          actionlint
      - name: Deploy entry points compile
        run: |
          python -m compileall -q deploy/agents deploy/cloud-control-plane tests/integration

  web:
    name: Web unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-studio/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test connector templates
        run: npm test
      - name: Type-check and build Vue Studio
        run: npm run build

  compose-config:
    name: Compose configuration and mTLS ingress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          cp .env.cloud.example .env.cloud
          docker compose --env-file .env.cloud -f deploy/docker-compose.cloud.yml config --quiet
      - name: Validate Agent mTLS HAProxy configuration
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tmp_dir/ca.key" -out "$tmp_dir/ca.crt" -subj "/CN=Agent CI Test CA" -days 1
          openssl req -newkey rsa:2048 -nodes -keyout "$tmp_dir/server.key" -out "$tmp_dir/server.csr" -subj "/CN=agent-ingress.test"
          openssl x509 -req -in "$tmp_dir/server.csr" -CA "$tmp_dir/ca.crt" -CAkey "$tmp_dir/ca.key" -CAcreateserial -out "$tmp_dir/server.crt" -days 1
          cat "$tmp_dir/server.crt" "$tmp_dir/server.key" > "$tmp_dir/agent-ingress.pem"
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/deploy/cloud-control-plane/agent-mtls/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v "$tmp_dir/agent-ingress.pem:/run/secrets/agent-ingress.pem:ro" \
            -v "$tmp_dir/ca.crt:/run/secrets/agent-client-ca.pem:ro" \
            haproxy:3.2-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: Exercise Agent mTLS ingress end to end
        run: python3 tests/integration/test_agent_mtls_proxy.py

  # ---------------- Stage 2: unit and integration tests ----------------
  metal3-crds:
    name: Metal3 and SR-IOV CRD integration
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kubectl_version=$(jq -r '.binaries.kubectl.version' deploy/offline/images.json)
          kubectl_sha256=$(jq -r '.binaries.kubectl.sha256' deploy/offline/images.json)
          curl -fsSLo kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          echo "${kubectl_sha256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Install PyYAML for renderer validation
        run: python3 -m pip install --quiet "PyYAML>=6.0,<7.0"
      - name: Create kind cluster
        run: kind create cluster --name metal3-crds --wait 120s
      - name: Apply CRDs and validate rendered manifests
        run: python3 tests/integration/kind_metal3_crds.py
      - name: Cluster diagnostics
        if: always()
        run: |
          kubectl get crd || true
          kubectl get pods -A || true
          kubectl -n capm3-system get deploy,po -o wide || true
          kubectl -n capm3-system logs deploy/ipam-controller-manager --tail=200 || true
          kubectl -n capm3-system describe pod -l app.kubernetes.io/name=ipam || true
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name metal3-crds || true

  agent-images:
    name: Agent image build (${{ matrix.image }})
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: eph-agent
            dockerfile: Dockerfile.eph-agent
          - image: target-agent
            dockerfile: Dockerfile.target-agent
          - image: cloud-control-agent
            dockerfile: Dockerfile.cloud-control-agent
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: |
          kubectl_version=$(jq -r '.binaries.kubectl.version' deploy/offline/images.json)
          kubectl_sha256=$(jq -r '.binaries.kubectl.sha256' deploy/offline/images.json)
          clusterctl_version=$(jq -r '.binaries.clusterctl.version' deploy/offline/images.json)
          clusterctl_sha256=$(jq -r '.binaries.clusterctl.sha256' deploy/offline/images.json)
          docker build -f ${{ matrix.dockerfile }} \
            --build-arg "KUBECTL_VERSION=${kubectl_version}" \
            --build-arg "KUBECTL_SHA256_AMD64=${kubectl_sha256}" \
            --build-arg "CLUSTERCTL_VERSION=${clusterctl_version}" \
            --build-arg "CLUSTERCTL_SHA256_AMD64=${clusterctl_sha256}" \
            -t ai-agent-stack/${{ matrix.image }}:ci .

  compose-e2e:
    name: Compose full stack smoke
    needs: [compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment files
        run: |
          cp .env.example .env
      - name: Build and start the complete local stack
        run: docker compose --env-file .env -f deploy/docker-compose.yml up --build -d
      - name: Smoke test Rust API and Vue Studio
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --fail http://localhost:8000/health/live
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --fail http://localhost:8000/health/ready
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --fail http://localhost:5173/
      - name: Show stack diagnostics
        if: always()
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml ps --all
          docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color api web || true
      - name: Stop local stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  quality-gate:
    name: Required quality gate
    needs: [rust-api, static, web, compose-config, metal3-crds, agent-images, compose-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate every required job
        run: |
          failures=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error title=$1::$1 concluded '$2'"
              failures=$((failures + 1))
            else
              echo "$1: success"
            fi
          }
          check static "${{ needs['static'].result }}"
          check web "${{ needs['web'].result }}"
          check compose-config "${{ needs['compose-config'].result }}"
          check metal3-crds "${{ needs['metal3-crds'].result }}"
          check agent-images "${{ needs['agent-images'].result }}"
          check compose-e2e "${{ needs['compose-e2e'].result }}"
          if [ "$failures" -ne 0 ]; then
            echo "$failures required job(s) did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
