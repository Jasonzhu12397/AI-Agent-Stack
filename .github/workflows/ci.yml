name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_stack
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_stack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agent:agent_dev_password@localhost:5432/agent_stack
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate deployment script syntax
        run: bash -n deploy/agents/deploy.sh && bash -n deploy/agents/build-node-agent.sh && bash -n deploy/cloud-control-plane/deploy.sh
      - name: Lint
        run: ruff check .
      - name: Django system checks
        run: python apps/platform-api/manage.py check
      - name: Check migration model drift
        run: python apps/platform-api/manage.py makemigrations --check --dry-run
      - name: Apply Django migrations
        run: python apps/platform-api/manage.py migrate --noinput
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-studio/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vue Studio
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          cp .env.cloud.example .env.cloud
          docker compose --env-file .env.cloud -f deploy/docker-compose.cloud.yml config --quiet
      - name: Build and smoke test production Vue image
        run: |
          docker build -f Dockerfile.web-studio -t ai-agent-web:ci .
          docker run -d --name ai-agent-web-ci -p 127.0.0.1:5174:8080 ai-agent-web:ci
          trap 'docker rm -f ai-agent-web-ci >/dev/null 2>&1 || true' EXIT
          if ! curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://localhost:5174/; then
            docker logs ai-agent-web-ci
            docker inspect ai-agent-web-ci --format '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}'
            exit 1
          fi
      - name: Build and start the complete local stack
        run: docker compose --env-file .env -f deploy/docker-compose.yml up --build -d
      - name: Smoke test Django API and Vue Studio
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --fail http://localhost:8000/health/live
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --fail http://localhost:8000/health/ready
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --fail http://localhost:5173/
          test "$(docker compose --env-file .env -f deploy/docker-compose.yml ps --status running --services worker)" = "worker"
      - name: Show stack diagnostics
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml ps
      - name: Stop local stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v
