name: Metal3 Lab Acceptance

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Platform project id whose BMHs and machines are verified
        required: true
        type: string
      control_plane_replicas:
        description: Expected control-plane node count
        required: true
        default: "3"
        type: string
      worker_replicas:
        description: Expected worker node count
        required: true
        default: "4"
        type: string

concurrency:
  group: metal3-lab-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  lab-readiness:
    name: Lab readiness report
    # A GitHub-hosted runner cannot reach the lab, so this job only judges the
    # workflow inputs and the shape of the kubeconfigs. It never fails the run:
    # a missing secret produces a report and a skipped acceptance stage.
    runs-on: ubuntu-latest
    environment: metal3-lab
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Materialize kubeconfig candidates
        env:
          EPH_KUBECONFIG: ${{ secrets.EPH_KUBECONFIG }}
          TARGET_KUBECONFIG: ${{ secrets.TARGET_KUBECONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/lab" evidence
          umask 077
          : > "$RUNNER_TEMP/lab/eph.kubeconfig"
          : > "$RUNNER_TEMP/lab/target.kubeconfig"
          if [ -n "$EPH_KUBECONFIG" ]; then
            printf '%s' "$EPH_KUBECONFIG" > "$RUNNER_TEMP/lab/eph.kubeconfig"
          fi
          if [ -n "$TARGET_KUBECONFIG" ]; then
            printf '%s' "$TARGET_KUBECONFIG" > "$RUNNER_TEMP/lab/target.kubeconfig"
          fi

      - name: Readiness report
        id: readiness
        env:
          EPH_KUBECONFIG: ${{ secrets.EPH_KUBECONFIG }}
          TARGET_KUBECONFIG: ${{ secrets.TARGET_KUBECONFIG }}
        run: |
          eph="$RUNNER_TEMP/lab/eph.kubeconfig"
          target="$RUNNER_TEMP/lab/target.kubeconfig"
          if [ -z "$EPH_KUBECONFIG" ]; then rm -f "$eph"; fi
          if [ -z "$TARGET_KUBECONFIG" ]; then rm -f "$target"; fi
          python tools/metal3_lab_readiness.py \
            --project "${{ inputs.project_id }}" \
            --control-plane-replicas "${{ inputs.control_plane_replicas }}" \
            --worker-replicas "${{ inputs.worker_replicas }}" \
            --eph-kubeconfig "$eph" \
            --target-kubeconfig "$target" \
            --out evidence/lab-readiness.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "### Lab readiness"
            echo ""
            echo '```json'
            cat evidence/lab-readiness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal3-lab-readiness
          path: evidence/lab-readiness.json
          retention-days: 30

  acceptance:
    name: Physical Metal3 acceptance
    # This job MUST run on a runner attached to the physical lab.
    # GitHub-hosted runners cannot prove bare-metal deployment.
    needs: lab-readiness
    if: needs.lab-readiness.outputs.ready == 'true'
    runs-on: [self-hosted, metal3-lab, physical]
    timeout-minutes: 120
    environment: metal3-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Materialize kubeconfigs
        env:
          EPH_KUBECONFIG: ${{ secrets.EPH_KUBECONFIG }}
          TARGET_KUBECONFIG: ${{ secrets.TARGET_KUBECONFIG }}
        run: |
          if [ -z "$EPH_KUBECONFIG" ] || [ -z "$TARGET_KUBECONFIG" ]; then
            echo "::error::Readiness passed without secrets; report and lab state disagree."
            exit 1
          fi
          umask 077
          printf '%s' "$EPH_KUBECONFIG" > "$RUNNER_TEMP/eph.kubeconfig"
          printf '%s' "$TARGET_KUBECONFIG" > "$RUNNER_TEMP/target.kubeconfig"

      - name: Preflight (read-only)
        run: |
          mkdir -p evidence
          python tools/metal3_acceptance.py preflight \
            --project "${{ inputs.project_id }}" \
            --out evidence/preflight.json

      - name: Redfish inventory (read-only)
        run: |
          python tools/metal3_acceptance.py redfish \
            --project "${{ inputs.project_id }}" \
            --out evidence/redfish.json

      - name: Deployment acceptance
        env:
          EPH_KUBECONFIG_PATH: ${{ runner.temp }}/eph.kubeconfig
          TARGET_KUBECONFIG_PATH: ${{ runner.temp }}/target.kubeconfig
        run: |
          python tools/metal3_acceptance.py verify \
            --project "${{ inputs.project_id }}" \
            --kubeconfig "$EPH_KUBECONFIG_PATH" \
            --target-kubeconfig "$TARGET_KUBECONFIG_PATH" \
            --control-plane-replicas "${{ inputs.control_plane_replicas }}" \
            --worker-replicas "${{ inputs.worker_replicas }}" \
            --redfish \
            --out evidence/acceptance.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal3-acceptance-evidence
          path: evidence/
          retention-days: 30
