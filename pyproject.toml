[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-stack"
version = "1.1.0"
description = "An extensible, policy-governed AI Agent platform."
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<7.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "Jinja2>=3.1,<4.0",
]

[project.scripts]
dev-agent = "apps.dev_agent.cli:main"
dev-agent-worker = "apps.dev_agent.worker:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["packages/agent_contracts", "packages/agent_transport", "apps/cloud_control_agent", "apps/eph_agent", "apps/target_agent", "apps/dev_agent"]
artifacts = ["apps/eph_agent/templates/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party source must stay byte-identical to upstream for provenance
# and for the MANIFEST.sha256 integrity check, so it is not reformatted here.
extend-exclude = ["deploy/metal3-lab/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
